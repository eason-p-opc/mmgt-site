.d-big .val i{font-style:normal;font-size:14px}
.d-big .bench{font-size:12px;color:var(--ink2);margin-top:2px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
.d-grid div{background:var(--card);padding:6px 12px}
.d-grid .k{font-size:10.5px;color:var(--ink3)}
.d-grid .v{font-size:12.5px;line-height:1.45;font-variant-numeric:tabular-nums;word-break:break-all;white-space:normal}
.d-sec{font-size:13px;font-weight:700;margin:16px 0 8px;padding-left:10px;border-left:3px solid var(--accent)}
.d-reason{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 14px}
.d-btns{display:flex;gap:10px;margin-top:16px}
.d-btns a{flex:1;text-align:center;padding:11px 0;border-radius:12px;font-weight:600}
.d-btns a.ghost{background:var(--tonal-blue);border:none;color:var(--accent)}
/* ---- 过往业绩表 / 采集历史表：圆角卡（与规格表同语言）---- */
table.perf,table.hx{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.perf th,table.hx th{background:var(--bg);color:var(--ink2);font-weight:600;font-size:11.5px}
table.perf th,table.perf td,table.hx th,table.hx td{border:none;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 10px}
table.perf tr>*:last-child,table.hx tr>*:last-child{border-right:none}
table.perf tr:last-child>* ,table.hx tr:last-child>*{border-bottom:none}
table.perf td.num,table.perf th.num,table.hx td.num,table.hx th.num{text-align:right;font-variant-numeric:tabular-nums}
/* ---- 筛选/排序/矩阵 Sheet 内部 ---- */
.fsec{margin:14px 0}
.fsec .fl{font-size:11.5px;color:var(--ink3);margin-bottom:7px}
.fsec select{width:100%;border:none;border-radius:10px;padding:9px 26px 9px 12px;font-size:13.5px;background-color:var(--fill);color:var(--ink)}
.fsec input[type=number]{width:100%;border:none;border-radius:10px;padding:9px 12px;font-size:13.5px;background:var(--fill);color:var(--ink);margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:none;background:var(--fill);border-radius:999px;padding:7px 16px;font-size:12.5px;cursor:pointer;color:var(--ink);transition:background var(--dur-1) var(--ease),transform var(--dur-1) var(--ease)}
.pill:hover{background:var(--fill-hover)}
.pill:active{transform:scale(.95)}
.pill.on{background:var(--onbg);border-color:var(--onbg);color:var(--onfg);font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.srow:hover{background:var(--hover)}
.srow.on{color:var(--accent);font-weight:600}
.sheet-foot{display:flex;gap:10px;margin-top:18px}
.sheet-foot button{flex:1;padding:11px 0;border-radius:12px;font-size:14px;cursor:pointer}
.sheet-foot .primary{background:var(--accent);border:none;color:#fff;font-weight:600}
.sheet-foot .ghost{background:var(--fill);border:none;color:var(--ink)}
/* ---- 选品矩阵（配色语义不动，只换形状）---- */
.mxhint{font-size:11.5px;color:var(--ink3);margin:6px 0}
.mxwrap{overflow-x:auto}
table.mx{width:100%;border-collapse:separate;border-spacing:4px;font-size:12px}
table.mx th{font-size:11.5px;color:var(--ink2);font-weight:600;padding:4px 2px}
table.mx th.mrk{text-align:left;white-space:nowrap}
.mxc{width:100%;border:none;border-radius:12px;padding:10px 4px;cursor:pointer;font-family:inherit;transition:transform var(--dur-1) var(--ease)}
.mxc:active{transform:scale(.96)}
.mxc b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.mxc i{display:block;font-style:normal;font-size:10.5px;opacity:.75;margin-top:2px}
.mxc.none{background:var(--fill);color:var(--ink3);cursor:default}
.mxc.on{outline:2px solid var(--accent);outline-offset:1px}
/* ---- 回到顶部：玻璃 FAB / 页脚 ---- */
#toTop{position:fixed;right:18px;bottom:24px;width:44px;height:44px;border-radius:50%;border:none;color:var(--ink);cursor:pointer;display:none;z-index:35;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-rim),var(--shadow-2);
  transition:transform var(--dur-1) var(--ease)}
#toTop:active{transform:scale(.94)}
#toTop.show{display:block}
footer{margin-top:24px;font-size:11.5px;color:var(--ink3);line-height:1.8}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:.35}to{opacity:1}}
/* ---- 产品详情页（?p= 路由）---- */
#pview{display:none;max-width:960px;margin:0 auto;padding:0 20px 60px}
body.pv #pview{display:block}
body.pv .wrap{display:none}
.pv-top{position:sticky;top:0;z-index:30;margin:0;padding:9px 0;border-radius:0 0 16px 16px;display:flex;align-items:center;gap:10px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--line)}
.pv-top button{border:none;background:var(--fill);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink);font-size:13px}
.pv-top .t{font-weight:700;font-size:15px}
.pv-name{font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1.4;margin:14px 0 2px}
.pv-code{font-size:12px;color:var(--ink3);margin-bottom:8px;font-variant-numeric:tabular-nums}
.trendbox{background:var(--card);border:none;border-radius:14px;padding:12px;box-shadow:var(--shadow-1)}
.trendbox svg{width:100%;height:auto;display:block}
.pv-note{font-size:11.5px;color:var(--ink3);margin:6px 0 0}
/* table.hx 样式并入上方 .perf 圆角卡块 */
.pv-disc{margin-top:16px;font-size:11.5px;color:var(--ink3);line-height:1.8}
/* ---- 趋势 SVG：Apple Charts 观感（平滑曲线 + 渐变面积，全走 token）---- */
.tsvg text{fill:var(--ink2);font-family:var(--sans)}
.tsvg .gline{stroke:var(--line)}
.tsvg .ln{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tsvg .dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.tsvg .tick{fill:var(--ink3)}
.tsvg .pvl{fill:var(--ink);font-weight:600}
[data-theme="dark"] .tsvg .pvl{fill:var(--ink)}
body{transition:background var(--dur-2),color var(--dur-2)}
/* ---- 三层降级链 ---- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .sticky,.pv-top{background:var(--bg)}
  #listbox thead th{background:var(--card)}
  #overlay{background:rgba(0,0,0,.55)}
  /* 2026-09-16：浮层降级补全 —— 无 backdrop-filter 时必须给不透明底，否则文字糊在内容上 */
  #toTop,#cmpBar,body.mdock .mtools,body.mdock .msearchrow input{background:var(--card)}
  #drawer{background:var(--card)}
  .tabs button,.ibtn{background:var(--fill)}
}
@media (prefers-reduced-transparency:reduce){
  .sticky,.pv-top{background:var(--bg)}
  #listbox thead th{background:var(--card)}
  #overlay{background:rgba(0,0,0,.55)}
  #toTop,#cmpBar,body.mdock .mtools,body.mdock .msearchrow input{background:var(--card)}
  #drawer{background:var(--card)}
  .tabs button,.ibtn{background:var(--fill)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
/* ---- E1 关注 / E2 对比 / E3 提醒 / E4 试算 ---- */
.wstar{border:none;background:none;cursor:pointer;font-size:14px;line-height:1;padding:2px 3px;color:var(--ink3);vertical-align:-2px}
.wstar:hover,.wstar.on{color:var(--orange)}
.card .c-wstar{margin-left:auto;font-size:16px}
.tagu{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--tonal-orange);color:var(--orange);white-space:nowrap}
/* 对比栏（2026-09-16）：玻璃参数统一到与 #toTop / 底部 Dock 同源的一组令牌 ——
   原用 --glass-sheet + 硬编码 blur(24px) saturate(1.8)，与回顶钮的 --glass-bg + blur(20px)
   不一致，三个浮层叠在一起时质感有差。现全部走 --glass-bg / --glass-blur / --glass-sat。 */
#cmpBar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:34;display:flex;gap:10px;align-items:center;padding:8px 10px 8px 16px;border-radius:999px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-rim),var(--shadow-2);font-size:13px}
#cmpBar .primary{background:var(--accent);border:none;color:#fff;font-weight:600;border-radius:999px;padding:7px 18px;cursor:pointer}
#cmpBar .ghost{background:var(--fill);border:none;color:var(--ink2);border-radius:999px;padding:7px 14px;cursor:pointer}
.cmpc{width:34px;text-align:center}
.cmpck-w{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--ink3)}
.cmpt{table-layout:fixed;width:100%}   /* V 矩阵：等宽列防长名称顶出抽屉 */
.cmpt th:first-child,.cmpt td.k{width:64px}
.cmpt th,.cmpt td.k{font-size:11px;color:var(--ink3);font-weight:600;white-space:nowrap}
.cmpt td{font-size:12px}
.cmpt .best{background:var(--tonal-blue);font-weight:600;border-radius:6px}
.cmpt .cmpname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;white-space:normal;font-size:12px;line-height:1.4}
/* C11 同类：PC 矩阵表头的产品代码同样会溢出（th 的 white-space:nowrap 盖过 <br>）——
   给 tcode 块级化 + 省略号，否则长代码会压到右邻列的「推荐」标签上。 */
.cmpt th .tcode{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* ---- 对比 W 行排（手机端）：粘性产品名列 + 指标横向滚动 ---- */
.wwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.wtab{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}
.wtab th{font-size:11px;color:var(--ink3);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
.wtab td{padding:9px 10px;border-bottom:1px solid var(--rowline);text-align:right;vertical-align:middle}
.wtab th.wname,.wtab td.wname{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;min-width:150px;max-width:170px;box-shadow:6px 0 8px -6px rgba(0,0,0,.12)}
.wtab td.wname b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.35;white-space:normal;word-break:break-all}
/* ⚠ 2026-09-20 修复：长产品代码（如 CYQWFZQZSLD14DA）撑破产品列。
   根因三条叠加：① 「max-width」对 table-cell 的固有尺寸不生效（CSS 规范），
   故 td.wname 的 max-width:170px 挡不住内容；② .wsub 是 flex，子项默认 min-width:auto 不收缩；
   ③ .wtab 整体 white-space:nowrap 阻止换行。
   修法：给 wname 加 width:170px（table-cell 用 width 才生效）+ .wsub 子项允许收缩并省略。 */
.wtab th.wname,.wtab td.wname{width:170px}
.wsub{display:flex;gap:5px;align-items:center;margin-top:5px;font-size:10.5px;color:var(--ink3);overflow:hidden}
.wsub>*{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsub .badge{flex:0 0 auto}
.wtab td.best{background:var(--tonal-blue);font-weight:600}
.wtab .num{font-variant-numeric:tabular-nums}
.minibtn{display:inline-block;margin:6px 8px 0 0;border:1px solid var(--line2);background:var(--fill);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:12px}
.minibtn:hover{border-color:var(--accent2);color:var(--accent)}
.calc{background:var(--bg);border-radius:12px;padding:10px 14px;margin-top:10px}
.calc .fl{font-size:11px;color:var(--ink3);margin-bottom:6px}
.calc input{width:100%;border:none;border-radius:8px;padding:8px 10px;background:var(--card);color:var(--ink);font-size:13px}
.calc .calcOut{margin-top:8px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rtag{display:inline-block;margin-left:4px;font-size:9px;padding:0 4px;border-radius:4px;background:var(--fill);color:var(--ink3);vertical-align:1px}
/* ---- 中间断点：渐进隐藏次要列（2026-09-20 用户拍板 A 方案）----
   PC 表格 17 列自然宽 1240px，而 .wrap 上限 1280px 且无横向滚动容器
   → 768~1259px 整页横向滚动，左侧「产品名称/代码」被推出屏幕（iPad 横屏正落此区间）。
   不用 overflow-x:auto 包裹的原因：**滚动容器会成为表头 position:sticky 的参照系**，
   实测表头会随页面滚走（top 48px → -572px），吸顶失效（docs/11 C13）。
   故改为按可用宽度逐列隐藏：不横滚、表头仍吸顶；隐藏列的字段在**详情抽屉与手机卡片**
   均可见（抽屉完整展示全部字段），故为「降级」而非「丢失」。 */
/* 隐藏顺序按「选择价值 ÷ 占宽」排：先砍信息密度最低的 权益%/申购开始，
   最后才动 银行/风险 —— 这两列是多银行横向对比的立足点，尽量留到最后。
   注：起购(55px) 比 风险(42px) 占宽更多而信息量更低，故先隐藏起购、保风险。 */
@media (min-width:768px) and (max-width:1023px){
  th,td{padding-left:5px;padding-right:5px}   /* 17 列 × 每列省 10px，比隐藏整列更划算 */
}
@media (min-width:768px) and (max-width:1339px){ .c-mb{display:none} }    /* 起购 */
@media (min-width:768px) and (max-width:1269px){ .c-y7,.c-w1{display:none} } /* 近7天% / 万元收益 */
@media (min-width:768px) and (max-width:1199px){ .c-yw{display:none} }    /* 累计收益 */
@media (min-width:768px) and (max-width:1159px){ .c-cat{display:none} }   /* 类别 */
@media (min-width:768px) and (max-width:1023px){ .c-eq,.c-bs{display:none} } /* 权益% / 申购开始 */

/* ---- 断点切换 ---- */
@media (max-width:767px){
  .wrap{padding:0 12px 36px}
  .sticky{margin:0;padding:9px 5px}
  .mast{padding:18px 0 12px}
  .mast h1{font-size:24px}
  .rgl{gap:7px}
  .rgl select{padding:8px 26px 8px 12px;font-size:13px;min-width:118px}
  .bar{display:none}
  .mtools{display:flex}
  .cards{display:flex}
  .listbox{display:none;border:none;background:none;box-shadow:none}
  .listbox table{display:none}
  .chipsRow{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .chipsRow::-webkit-scrollbar{display:none}
  .chipsRow .fchip,.chipsRow .fclear,.chipsRow #cnt{flex:0 0 auto;max-width:none}   /* 禁止压缩：保持长条形，整行左右滑动 */
  .c-meta .btn{padding:10px 18px;font-size:13px}
  #cmpBar{bottom:calc(20px + env(safe-area-inset-bottom));width:min(340px,calc(100% - 24px));max-width:calc(100% - 24px)}   /* 与搜索框/Dock 同宽 340px，窄屏按屏宽自适应 */
  #cmpBar .primary{flex:1;min-width:0}   /* 对比钮吃掉剩余宽度 */
  body.mdock #cmpBar{bottom:calc(70px + env(safe-area-inset-bottom))}
  .chipsRow #cnt{margin-left:auto;flex:0 0 auto}
  #toTop{bottom:calc(20px + env(safe-area-inset-bottom))}
  /* ---- 底部 Dock：下滑时工具钮收进液态玻璃胶囊 ----
     2026-09-16 用户拍板两项调整：
       ① **关注页（S.cat==='watch'）不显示 Dock** —— body.nowatchdock 由 renderAll 维护；
       ② 圆角加大到 20px（原 14px），毛玻璃与 #toTop 完全对齐（同一组 --glass-* 令牌 +
          同款 inset 高光/描边 + --shadow-2），保证两个浮层视觉一致。 */
  .mtools{transition:transform .38s var(--ease-sheet)}
  body.mdock .mtools{position:fixed;left:12px;right:auto;width:min(340px,calc(100% - 84px));height:48px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:36;margin:0;padding:5px;gap:4px;
    background:var(--glass-bg);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
    backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
    border-radius:20px;
    box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-rim),var(--shadow-2)}
  body.mdock .mtools .mbtn{background:var(--glass-in);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-rim);
    height:38px;flex:1 1 0;flex-direction:column;gap:1px;border-radius:14px;font-size:9.5px;padding:0 8px}
  body.mdock .mtools .mbtn .mi svg{width:14px;height:14px}
  /* 关注页：不吸底（工具行留在原位），回顶钮也不上抬 */
  body.nowatchdock.mdock .mtools{position:static;height:auto;width:auto;background:transparent;box-shadow:none;
    -webkit-backdrop-filter:none;backdrop-filter:none;padding:0;gap:8px;border-radius:0;transform:none !important}
  body.nowatchdock.mdock .mtools .mbtn{background:var(--card);box-shadow:none;height:40px;flex:1;flex-direction:row;gap:5px;border-radius:12px;font-size:12px;padding:0}
  body.nowatchdock.mdock #cmpBar{bottom:calc(20px + env(safe-area-inset-bottom))}
  /* Dock 态点搜索：搜索框固定浮在 Dock 上方，不回跳顶部（宽度与 Dock 一致，玻璃同款） */
  body.mdock:not(.nowatchdock).search-open .msearchrow{display:block;position:fixed;left:12px;right:auto;width:min(340px,calc(100% - 84px));bottom:calc(70px + env(safe-area-inset-bottom));z-index:37;margin:0;padding:0}
  body.mdock:not(.nowatchdock).search-open .msearchrow input{background:var(--glass-bg);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
    box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-rim),var(--shadow-2);border-radius:20px;padding:11px 14px}
  #toTop{bottom:calc(14px + env(safe-area-inset-bottom))}
}

<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1>银行理财日报</h1>
      <div class="dateline" id="dateline"></div>
    </div>
    <div class="mast-r">
      <button class="ibtn" id="themeBtn" aria-label="切换深浅色" title="深浅色：自动 / 浅色 / 深色">◐</button>
    </div>
  </header>

  <div class="sticky">
    <div class="trow">
      <div class="tabs" id="tabs"></div>
    </div>
  </div>

  <div class="bar" id="pcbar">
    <span class="searchwrap"><label>搜索 <input type="text" id="q" placeholder="名称 / 代码 / 银行"></label></span>
    <label>银行 <select id="bank"></select></label>
    <label>风险 <select id="rkSel"><option value="">全部</option><option value="1">R1</option><option value="2">R2</option><option value="3">R3</option></select></label>
    <label>封闭期 <select id="termSel"></select></label>

<script>
var CFG = {"y1red":3,"y1orange":2,"stableMin":0.8,"recScoreMin":6,"recStableMin":0.7,"recMaxRisk":2,"recWScore":0.5,"recWStable":0.3,"recWYield":0.2};
/* 对比推荐（docs/15）：模块级 pickBest 的序列化注入 —— 单测覆盖模块版，壳内跑同一份逻辑。 */
var PICK_BEST = function pickBest(rows, opt = {}) {
  const {
    scMin = 6.0, stMin = 0.7, rkMax = 2,
    wSc = 0.5, wSt = 0.3, wY = 0.2,
  } = opt;
  const stabOf = (r) => (typeof r.st === 'number' && typeof r.pt === 'number') ? Math.min(r.st, r.pt) : null;
  const riskOf = (r) => (typeof r.rk === 'number' && r.rk >= 1 && r.rk <= 5) ? r.rk : 9;
  // 全部候选都缺稳健度 → 降级为只卡评分+风险，避免整个功能失效
  const provisional = rows.filter(r => stabOf(r) !== null).length === 0;

  const cand = rows.filter(r => {
    if (!(typeof r.sc === 'number' && r.sc >= scMin)) return false;
    if (riskOf(r) > rkMax) return false;
    if (provisional) return true;
    const s = stabOf(r);
    return s !== null && s >= stMin;   // 缺稳健度 → 从严排除
  });
  // 供「无人达标」横幅用的本组统计（只给实际分布，**不含阈值**，守 docs/11 E2 黑盒）
  const allSc = rows.map(r => (typeof r.sc === 'number' ? r.sc : -Infinity));
  const allSt = rows.map(stabOf).filter(v => v !== null);
  const stats = {
    n: rows.length,
    maxScore: allSc.length ? Math.max(...allSc) : null,
    maxStab: allSt.length ? Math.max(...allSt) : null,
  };
  if (!cand.length) return { best: [], provisional, reason: 'none', stats };

  const norm = (get) => {
    const vs = cand.map(get).filter(v => typeof v === 'number' && isFinite(v));
    if (vs.length < cand.length) return null;          // 不是全员有值 → 该项不参与
    const lo = Math.min(...vs), hi = Math.max(...vs);
    if (hi === lo) return { all: true, f: () => 1 };   // 全相同 → 都给满分（该维度不区分）
    return { all: false, f: (v) => (v - lo) / (hi - lo) };
  };
  // 收益项：近1月年化优先；全缺则试累计收益
  const ySrc = cand.every(r => typeof r.y1 === 'number') ? (r => r.y1)
    : (cand.every(r => typeof r.yw === 'number') ? (r => r.yw) : null);
  const nSc = norm(r => r.sc);
  const nSt = provisional ? null : { all: false, f: (v) => v };   // 短板本已 0~1，直接用
  const nY = ySrc ? norm(ySrc) : null;

  const parts = [];
  if (nSc) parts.push([wSc, nSc, r => r.sc]);
  if (nSt) parts.push([wSt, nSt, r => stabOf(r)]);
  if (nY) parts.push([wY, nY, ySrc]);          // 缺失项不计入 → 权重天然按比例分给其余项
  const wsum = parts.reduce((a, p) => a + p[0], 0);

  const scored = cand.map(r => {
    let v = 0;
    for (const [w, n, get] of parts) v += w * (n.all ? 1 : n.f(get(r)));
    return { r, v: wsum ? v / wsum : 0 };
  });
  scored.sort((a, b) => {
    if (b.v !== a.v) return b.v - a.v;
    if (b.r.sc !== a.r.sc) return b.r.sc - a.r.sc;                       // 平局比评分
    const sa = stabOf(a.r), sb = stabOf(b.r);
    return (sb === null ? -1 : sb) - (sa === null ? -1 : sa);            // 再平局比稳健度
  });
  // 并列：推荐分完全相同的一并入选（用户拍板「并列标红」）
  const top = scored[0].v;
  const best = scored.filter(x => Math.abs(x.v - top) < 1e-9).map(x => x.r);
  return { best, provisional, reason: best.length > 1 ? 'tie' : 'ok', stats };
};

/* ---- E3 临近开售 / 日历 / 持仓 + E4 收益试算 ---- */
function daysUntil(bs) {
  if (!/^d{4}-d{2}-d{2}$/.test(bs || '')) return null;
  return Math.round((new Date(bs + 'T00:00:00') - new Date(new Date().toISOString().slice(0, 10) + 'T00:00:00')) / 86400000);
}
function upcomingChip(r) {
  var d = daysUntil(r.bs);
  return (d !== null && d >= 0 && d <= 3) ? '<span class="tagu">' + (d === 0 ? '今日开售' : d + ' 天后开售') + '</span>' : '';
}
function icsHtml(r) {
  var d = daysUntil(r.bs);
  if (d === null || d < 0) return '';
  return '<button class="minibtn" data-ics="' + esc(r.code) + '">加到日历（' + esc(r.bs.slice(5)) + ' 开售）</button>';
}
function holdHtml(r) {

function calcHtml(r) {

  return '<div class="calc"><div class="fl">收益试算（按近1月年化 ' + r.y1.toFixed(2) + '% 估算，仅供参考）</div>'

/* 对比推荐（docs/15，2026-09-20 用户拍板 B 方案）—— **实现在模块级并导出**（可单测），
   此处仅做参数注入。逻辑详见模块顶部 pickBest 的注释（含「有条件推荐」的设计理由）。
   ⚠ 提取到模块级的原因与 highlightOf 同理：逻辑要能被 node:test 直接覆盖。 */
function pickBest(rows) {
  return PICK_BEST(rows, {
    scMin: CFG.recScoreMin, stMin: CFG.recStableMin, rkMax: CFG.recMaxRisk,
    wSc: CFG.recWScore, wSt: CFG.recWStable, wY: CFG.recWYield,
  });
}

function compareHtml() {
  var rows = CMP.map(function (c) { return findRow(c); }).filter(Boolean);
  if (rows.length < 2) return '<div class="d-sec" style="margin-top:0">产品对比</div><div class="empty">在「关注」列表勾选 2~4 只产品后对比</div>';
  var rec = pickBest(rows);
  var bestSet = {};
  rec.best.forEach(function (r) { bestSet[r.code] = 1; });
  var banner = recBanner(rec);
  var num = function (r, k) { return typeof r[k] === 'number' && isFinite(r[k]) ? r[k] : null; };
  /* ---- 手机（≤767px）W 行排：一行一产品全指标，粘性产品名列 + 横向滚动翻看指标 ---- */
  if (window.matchMedia('(max-width:767px)').matches) {
    var cols = [
      ['近1月%', function (r) { return '<span class="' + ycls(r.y1) + ' num">' + fmt(r.y1, 2) + '</span>'; }, 'max', 'y1'],
      ['近3月%', function (r) { return '<span class="num">' + fmt(r.y3, 2) + '</span>'; }, 'max', 'y3'],
      ['近7天%', function (r) { return '<span class="num">' + fmt(r.y7, 2) + '</span>'; }, 'max', 'y7'],
      ['万元收益', function (r) { return '<span class="num">' + fmt(r.w1, 4) + '</span>'; }, 'max', 'w1'],
      ['评分', function (r) { return scoreHtml(r.sc); }, 'max', 'sc'],
      ['封闭期', function (r) { return esc(r.tt || '—'); }, 'min', 'td'],
      ['风险', function (r) { return '<span class="' + rkcls(r.rl) + '">' + esc(riskShort(r.rl) || '—') + '</span>'; }, null, null],
      ['起购', function (r) { return '<span class="num">' + esc(r.mb || '—') + '</span>'; }, null, null],
      ['申购开始', function (r) { return '<span class="num">' + esc(r.bs ? r.bs.slice(5) : '—') + '</span>'; }, null, null],
      ['购买', function (r) { return lwOf(r) ? '<a class="btn' + (bestSet[r.code] ? ' rec-btn' : '') + '" href="' + esc(lwOf(r)) + '" target="_blank" rel="noopener">' + (bestSet[r.code] ? '立即购买' : '购买') + '</a>' : '—'; }, null, null],
    ];
    var bests = {};
    cols.forEach(function (a, i) {
      if (!a[2]) return;
      var pool = rows.map(function (x) { return num(x, a[3]); }).filter(function (x) { return x !== null; });
      if (pool.length > 1 && pool.some(function (x) { return x !== pool[0]; }))
        bests[i] = a[2] === 'max' ? Math.max.apply(null, pool) : Math.min.apply(null, pool);
    });
    var whead = '<tr><th class="wname">产品</th>' + cols.map(function (a) { return '<th>' + a[0] + '</th>'; }).join('') + '</tr>';
    var wbody = rows.map(function (r) {
      return '<tr' + (bestSet[r.code] ? ' class="recrow"' : '') + '><td class="wname"><b title="' + esc(r.n) + '">' + esc(r.n) + (bestSet[r.code] ? ' <span class="rec-tag">推荐</span>' : '') + '</b><span class="wsub">' + badge(r.c) + esc(shortBank(r.b)) + ' <span class="tcode">' + esc(r.cd) + '</span></span></td>'
        + cols.map(function (a, i) {
            var v = a[3] ? num(r, a[3]) : null;
            return '<td class="' + (bests[i] != null && v === bests[i] ? 'best' : '') + '">' + a[1](r) + '</td>';
          }).join('') + '</tr>';
    }).join('');
    return banner + '<div class="d-sec" style="margin-top:0">产品对比（' + rows.length + ' 只）</div>'
      + '<div class="wwrap"><table class="wtab"><thead>' + whead + '</thead><tbody>' + wbody + '</tbody></table></div>';
  }
  /* ---- PC V 矩阵：产品为列（table-layout:fixed，名称两行换行防顶出） ---- */
  function cellHtml(r, a) {
    var v = a[3] ? num(r, a[3]) : null;
    var cls = 'num';
    if (a[2] && v !== null) {
      var pool = rows.map(function (x) { return num(x, a[3]); }).filter(function (x) { return x !== null; });
      if (pool.length > 1) {
        var best = a[2] === 'max' ? Math.max.apply(null, pool) : Math.min.apply(null, pool);
        if (v === best && pool.some(function (x) { return x !== best; })) cls += ' best';

function trendSvg(pts) {

  var P = pts.map(function (x, i) { return [X(i), Y(x.v)]; });

  } else {

    for (var i = 0; i < P.length - 1; i++) {

      line += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)
        + ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)
        + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
  }
  var area = line + ' L' + X(pts.length - 1).toFixed(1) + ' ' + (H - pb) + ' L' + X(0).toFixed(1) + ' ' + (H - pb) + ' Z';

    + '<stop offset="0" style="stop-color:var(--accent);stop-opacity:.22"/>'
    + '<stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>';
  /* 三条水平基准线（max/中位/min）+ 刻度值 */
  var ticks = '';
  [[max, pt], [(min + max) / 2, (pt + (H - pb)) / 2], [min, H - pb]].forEach(function (t) {
    ticks += '<line class="gline" x1="' + pl + '" y1="' + t[1].toFixed(1) + '" x2="' + (W - pr) + '" y2="' + t[1].toFixed(1) + '"/>'
      + '<text class="tick" x="' + (pl - 7) + '" y="' + (t[1] + 3.5).toFixed(1) + '" text-anchor="end" font-size="10.5">' + t[0].toFixed(2) + '</text>';
  });
  /* 每点：白环圆点 + 数值标注 + 日期（点 ≤8 个时全标，>8 个标首尾） */
  var ann = pts.map(function (x, i) {
    var showDate = pts.length <= 8 || i === 0 || i === pts.length - 1;
    return '<circle class="dot" cx="' + X(i).toFixed(1) + '" cy="' + Y(x.v).toFixed(1) + '" r="3.5"><title>'
      + esc(x.l) + ' · ' + x.v.toFixed(2) + '%</title></circle>'
      + '<text class="pvl" x="' + X(i).toFixed(1) + '" y="' + (Y(x.v) - 10).toFixed(1) + '" text-anchor="middle" font-size="10.5">' + x.v.toFixed(2) + '%</text>'
      + (showDate ? '<text class="tick" x="' + X(i).toFixed(1) + '" y="' + (H - pb + 16) + '" text-anchor="middle" font-size="10">' + esc(x.l.slice(5)) + '</text>' : '');
  }).join('');
  return '<svg class="tsvg" viewBox="0 0 ' + W + ' ' + H + '">' + defs + ticks
    + '<path class="area" d="' + area + '" fill="url(#' + gid + ')"/>'

    + (hasSnap || !hasCh ? '「本站快照年化」随每日采集自动积累（当前已采集 ' + DATA.days.length + ' 天）。' : '')
    + '源站不提供单位净值序列，故无净值曲线。</p>'
    + perf
    + '<div class="d-sec">本站采集历史</div><table class="hx"><thead><tr><th>采集日期</th><th class="num">近1月年化%</th><th class="num">评分</th></tr></thead><tbody>'
    + (histRows || '<tr><td colspan="3">—</td></tr>') + '</tbody></table>'
    + '<div class="d-grid" style="margin-top:14px">' + kv.map(function (x) { return '<div><div class="k">' + x[0] + '</div><div class="v">' + x[1] + '</div></div>'; }).join('') + '</div>'
    + (r.c !== 'onsale' && r.rs ? '<div class="d-sec">募集说明</div><div class="d-reason">' + esc(r.rs) + '</div>' : '')
    + '<div class="d-btns">'
    + (lwOf(r) ? '<a class="btn" href="' + esc(lwOf(r)) + '" target="_blank" rel="noopener">官网购买</a>' : '')
    + (laOf(r) && laOf(r) !== lwOf(r) ? '<a class="ghost" style="text-align:center;padding:10px 0;border-radius:9px;font-weight:600" href="' + esc(laOf(r)) + '" target="_blank" rel="noopener">App 端购买</a>' : '')
    + '</div>'
    + '<div class="pv-disc">数据来源为各银行公开渠道接口，可能存在延迟或错漏；本页仅供参考，不构成投资建议。理财非存款、产品有风险、投资须谨慎。</div>';
  $('pvBack').addEventListener('click', function () { if (pushed) history.back(); else gotoList(); });
  pv.addEventListener('click', function (e) {
    var tt = e.target.dataset && e.target.dataset.tt;
    if (!tt) return;
    $('tb-ch').style.display = tt === 'ch' ? '' : 'none';
    $('tb-snap').style.display = tt === 'snap' ? '' : 'none';
    e.target.parentElement.querySelectorAll('.pill').forEach(function (x) { x.classList.toggle('on', x === e.target); });
  });
}
window.addEventListener('popstate', route);

/* ---- 事件 ---- */
function bind() {
  $('tabs').addEventListener('click', function (e) {
    var c = e.target.dataset && e.target.dataset.c;
    if (c) { S.cat = c; renderAll(); }
  });
  $('tabs').addEventListener('change', function (e) {
    if (e.target.id === 'rangeSel') { S.range = +e.target.value; renderAll(); }
  });
  var qT;
  $('q').addEventListener('input', function (e) {
    clearTimeout(qT);
    qT = setTimeout(function () { S.q = e.target.value.trim().toLowerCase(); renderAll(); }, 300);
  });
  $('qm').addEventListener('input', function (e) {
    clearTimeout(qT);
    qT = setTimeout(function () { S.q = e.target.value.trim().toLowerCase(); $('q').value = S.q; renderAll(); }, 300);
  });
  $('bank').addEventListener('change', function (e) { S.bank = e.target.value; renderAll(); });
  $('rkSel').addEventListener('change', function (e) { S.rk = e.target.value; renderAll(); });
  $('termSel').addEventListener('change', function (e) { S.term = e.target.value; renderAll(); });
  var mT;
  $('miny').addEventListener('input', function (e) {
    clearTimeout(mT);
    mT = setTimeout(function () { var v = parseFloat(e.target.value); S.miny = isFinite(v) ? v : null; renderAll(); }, 300);
  });
  $('hlon').addEventListener('change', function (e) { S.hl = e.target.checked; renderAll(); });
  $('stableon').addEventListener('change', function (e) { S.stable = e.target.checked; renderAll(); });
  $('resetBtn').addEventListener('click', resetFilters);
  $('mxBtn').addEventListener('click', function () { openSheet('matrix'); });
  $('mSearch').addEventListener('click', function () {
    document.body.classList.toggle('search-open');
    if (document.body.classList.contains('search-open')) $('qm').focus();
  });
  $('mFilter').addEventListener('click', function () { openSheet('filter'); });
  $('mSort').addEventListener('click', function () { openSheet('sort'); });
  $('mMatrix').addEventListener('click', function () { openSheet('matrix'); });
  $('listbox').addEventListener('click', function (e) {
    if (e.target.id === 'resetF') { resetFilters(); return; }
    var ws = e.target.closest('[data-w]');
    if (ws) { toggleWatch(ws.dataset.w); return; }
    if (e.target.dataset && e.target.dataset.k) {          // 表头三态排序：降 → 升 → 默认
      var k0 = e.target.dataset.k;
      if (S.sort === k0) { if (S.dir === -1) S.dir = 1; else { S.sort = null; S.dir = -1; } }
      else { S.sort = k0; S.dir = -1; }
      renderAll();
      return;
    }
    var iname = e.target.closest('a.iname');
    if (iname && !e.metaKey && !e.ctrlKey) { e.preventDefault(); gotoDetail(iname.dataset.p); return; }
    if (e.target.closest('.cmpc')) return;   // E2：勾选框区域只切换选中，不跳详情
    if (e.target.closest('a,button')) return;
    var tr = e.target.closest('tr[data-code]');
    if (tr) openDetail(tr.dataset.code);
  });
  $('cards').addEventListener('keydown', function (e) {   // 卡片键盘可达（a11y）
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.tagName === 'INPUT') return;             // 勾选框空格=切换勾选，不跳详情
    var card = e.target.closest('.card[data-code]');
    if (card) { e.preventDefault(); gotoDetail(card.dataset.code); }
  });
  $('cards').addEventListener('click', function (e) {
    if (e.target.id === 'resetF') { resetFilters(); return; }
    var ws = e.target.closest('[data-w]');
    if (ws) { toggleWatch(ws.dataset.w); return; }
    if (e.target.closest('.cmpck-w')) return;             // E2：「比」勾选只切换选中，不跳详情
    if (e.target.closest('a,button')) return;
    var card = e.target.closest('.card[data-code]');
    if (card) gotoDetail(card.dataset.code);
  });
  function cmpChange(e) {   // E2 对比勾选（表格 + 卡片共用）
    if (!e.target.classList || !e.target.classList.contains('cmpck')) return;
    var c = e.target.dataset.cmp;
    if (e.target.checked) {
      if (CMP.indexOf(c) < 0 && CMP.length < 4) CMP.push(c); else e.target.checked = false;
    } else { var i = CMP.indexOf(c); if (i >= 0) CMP.splice(i, 1); }
    renderCmpBar();
  }
  $('listbox').addEventListener('change', cmpChange);
  $('cards').addEventListener('change', cmpChange);
  $('cmpBar').addEventListener('click', function (e) {
    if (e.target.id === 'cmpGo') openCompare();
    if (e.target.id === 'cmpClear') { CMP = []; renderCmpBar(); renderList(); }
  });
  document.addEventListener('click', function (e) {   // E3 日历导出 / 持仓标记（详情级委托）
    var icsBtn = e.target.closest('[data-ics]');
    if (icsBtn) {
      var rr = findRow(icsBtn.dataset.ics); if (!rr) return;
      var dt = rr.bs.replace(/-/g, '');
      var dd = new Date(rr.bs + 'T00:00:00'); dd.setDate(dd.getDate() + 1);
      var icsDoc = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MMGT//CN', 'BEGIN:VEVENT',
        'UID:' + rr.code + '@mmgt',
        'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
        'DTSTART;VALUE=DATE:' + dt, 'DTEND;VALUE=DATE:' + dd.toISOString().slice(0, 10).replace(/-/g, ''),
        'SUMMARY:理财开售：' + (rr.n || rr.code),
        'DESCRIPTION:代码 ' + rr.code + ' · ' + (rr.b || '') + (lwOf(rr) ? ' · ' + lwOf(rr) : ''),
        'END:VEVENT', 'END:VCALENDAR'].join('\r\n');   // 注意：处于模板字符串内，须双反斜杠，否则产物中出现真实 CRLF 拆断字符串
      var blob = new Blob([icsDoc], { type: 'text/calendar' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '理财开售-' + (rr.n || rr.code) + '.ics';
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    var hold = e.target.closest('[data-hold]');
    if (hold) {
      var hi = HOLD.indexOf(hold.dataset.hold);
      if (hi >= 0) HOLD.splice(hi, 1); else HOLD.push(hold.dataset.hold);
      try { localStorage.setItem(HKEY, JSON.stringify(HOLD)); } catch (err) {}
      renderAll();
    }
  });
  document.addEventListener('input', function (e) {   // E4 收益试算
    if (!e.target.classList || !e.target.classList.contains('calcIn')) return;
    var amt = parseFloat(e.target.value), y1 = parseFloat(e.target.dataset.y1);
    var out = e.target.parentElement.querySelector('.calcOut');
    if (!out) return;
    if (!(amt > 0) || !isFinite(y1)) { out.style.display = 'none'; return; }
    var day = amt * y1 / 100 / 365;
    out.style.display = 'block';
    out.textContent = '估算：日收益约 ' + day.toFixed(2) + ' 元 · 30 天约 ' + (day * 30).toFixed(2) + ' 元 · 一年约 ' + Math.round(day * 365).toLocaleString() + ' 元';
  });
  $('chipsRow').addEventListener('click', function (e) {
    if (e.target.id === 'clearAll') { resetFilters(); return; }
    var k = e.target.dataset && e.target.dataset.k;
    if (!k) return;
    if (k === 'bank') S.bank = '';
    if (k === 'rk') S.rk = '';
    if (k === 'term') S.term = '';
    if (k === 'miny') S.miny = null;
    if (k === 'hl') S.hl = false;
    if (k === 'stable') S.stable = false;   // C-①
    if (k === 'q') S.q = '';
    renderAll();
  });
  /* Sheet 内部（委托：内容会重建） */
  $('drawerBody').addEventListener('click', function (e) {
    var pill = e.target.closest('.pill');
    if (pill) {
      if (pill.dataset.g === 'term') S.term = pill.dataset.v;
      if (pill.dataset.g === 'rk') S.rk = pill.dataset.v;
      if (pill.dataset.g === 'miny') S.miny = pill.dataset.v === '' ? null : parseFloat(pill.dataset.v);
      renderAll(); rebuildSheet(); return;
    }
    var mxc = e.target.closest('.mxc[data-rk]');
    if (mxc) {
      var same = S.rk === mxc.dataset.rk && S.term === mxc.dataset.t;
      if (same) { S.rk = ''; S.term = ''; } else { S.rk = mxc.dataset.rk; S.term = mxc.dataset.t; }
      renderAll(); rebuildSheet(); return;
    }
    if (e.target.id === 'fsReset' || e.target.id === 'mxReset') {
      S.bank = ''; S.rk = ''; S.term = ''; S.miny = null; S.hl = false;
      renderAll(); rebuildSheet(); return;
    }
    if (e.target.id === 'fsDone') { closeDetail(); return; }
    var df = e.target.closest('.dfull');
    if (df) { e.preventDefault(); gotoDetail(df.dataset.p); return; }
    var srow = e.target.closest('.srow[data-v]');
    if (srow) {
      var kv = srow.dataset.v.split(':');
      S.sort = kv[0] || null; S.dir = kv[0] ? (kv[1] === '1' ? 1 : -1) : -1;
      renderAll(); closeDetail();
    }
  });
  $('drawerBody').addEventListener('change', function (e) {
    if (e.target.id === 'fsBank') { S.bank = e.target.value; renderAll(); refreshSheetDone(); }
    if (e.target.id === 'fsHl') { S.hl = e.target.checked; renderAll(); refreshSheetDone(); }
    if (e.target.id === 'fsStable') { S.stable = e.target.checked; renderAll(); refreshSheetDone(); }   // C-①
  });
  var fsT;
  $('drawerBody').addEventListener('input', function (e) {
    if (e.target.id === 'fsMinyIn') {   // 审核 2026-09-14：300ms 防抖，避免逐键全量重渲
      clearTimeout(fsT);
      fsT = setTimeout(function () {
        var v = parseFloat(e.target.value); S.miny = isFinite(v) ? v : null;
        renderAll(); refreshSheetDone();
      }, 300);
    }
  });
  $('themeBtn').addEventListener('click', function () {
    // 按当前外观一键取反：浅色→深色、深色→浅色（单次点击即生效；初始跟随系统）
    var dark = document.documentElement.dataset.theme === 'dark';
    localStorage.setItem(THEME_KEY, dark ? 'light' : 'dark');
    applyTheme();
  });
  MQL_DARK.addEventListener ? MQL_DARK.addEventListener('change', function () { applyTheme(); }) : MQL_DARK.addListener(function () { applyTheme(); });
  $('overlay').addEventListener('click', closeDetail);
  $('drawerClose').addEventListener('click', closeDetail);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });
  document.addEventListener('keydown', function (e) {   // 焦点圈禁：抽屉打开时 Tab 循环在抽屉内（a11y）
    if (e.key !== 'Tab' || !$('drawer').classList.contains('open')) return;
    var f = [$('drawerClose')].concat([].slice.call($('drawerBody').querySelectorAll('a[href],button:not([disabled]),input,select,[tabindex="0"]')));
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === $('drawer'))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  (function () {   // 移动端：把手下拉关闭
    var sy = 0, dy = 0, on = false, sheet = $('drawer'), h = $('drawerHandle');
    h.addEventListener('touchstart', function (e) { sy = e.touches[0].clientY; dy = 0; on = true; sheet.style.transition = 'none'; }, { passive: true });
    h.addEventListener('touchmove', function (e) { if (!on) return; dy = Math.max(0, e.touches[0].clientY - sy); sheet.style.transform = 'translateY(' + dy + 'px)'; }, { passive: true });
    h.addEventListener('touchend', function () { on = false; sheet.style.transition = ''; if (dy > 80) closeDetail(); else sheet.style.transform = ''; });
  })();
  var tt = $('toTop');
  window.addEventListener('scroll', function () { tt.classList.toggle('show', window.scrollY > 600); }, { passive: true });
  tt.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  /* ---- 移动端底部 Dock：下滑过工具行原位后收进底部玻璃胶囊，回滚原位还原（FLIP 位移） ----
     2026-09-16 用户拍板：**关注页不显示 Dock**（body.nowatchdock，由 renderAll 维护）——
     关注页没有筛选/排序/矩阵需求，底部浮层只会遮挡内容。 */
  (function () {
    var mt = $('mtools'); if (!mt) return;
    var dockAt = 0, docked = false;
    function suppressed() { return document.body.classList.contains('nowatchdock'); }
    function measure() { dockAt = MQL.matches ? mt.offsetTop - 10 : 0; }
    function flipTo(apply) {          /* apply: true=入坞, false=回原位；记录位移前后差值做反向动画 */
      if (apply && suppressed()) return;   // 关注页：不吸底
      var before = mt.getBoundingClientRect().top;
      docked = apply;
      document.body.classList.toggle('mdock', apply);
      var dy = before - mt.getBoundingClientRect().top;
      if (!dy) return;
      mt.style.transition = 'none';
      mt.style.transform = 'translateY(' + dy + 'px)';
      requestAnimationFrame(function () { mt.style.transition = ''; mt.style.transform = ''; });
    }
    window.__mmgtFlipTo = flipTo;      // 供 renderAll 在切到关注页时立即出坞
    window.addEventListener('scroll', function () {
      if (!MQL.matches || document.body.classList.contains('pv')) return;
      if (!docked && window.scrollY > dockAt) flipTo(true);
      else if (docked && window.scrollY <= dockAt) flipTo(false);
    }, { passive: true });
    window.addEventListener('resize', function () { measure(); if (!MQL.matches && docked) flipTo(false); });
    window.addEventListener('load', measure);
    measure();
  })();
  /* 桌面窄窗口 Tab 换行时吸顶栏变高 → 动态同步表头吸顶偏移（审核 2026-09-14 前端2） */
  (function () {
    var st = document.querySelector('.sticky'); if (!st) return;
    var syncH = function () { document.documentElement.style.setProperty('--sticky-h', st.offsetHeight + 'px'); };
    if ('ResizeObserver' in window) new ResizeObserver(syncH).observe(st);
    window.addEventListener('resize', syncH, { passive: true });
    syncH();
  })();
  MQL.addEventListener ? MQL.addEventListener('change', renderList) : MQL.addListener(renderList);
}
function rebuildSheet() {
  if (!sheetKind) return;
  var keep = $('drawerBody').scrollTop;
  $('drawerBody').innerHTML = sheetKind === 'filter' ? filterSheetHtml() : sheetKind === 'sort' ? sortSheetHtml() : sheetKind === 'compare' ? compareHtml() : matrixHtml();
  $('drawerBody').scrollTop = keep;
}
function resetFilters() {
  S.bank = ''; S.q = ''; S.miny = null; S.hl = false; S.stable = false; S.cat = 'all'; S.sort = null; S.dir = -1; S.term = ''; S.rk = '';
  renderAll();
}

/* 启动（2026-09-16 配合 data.js 的 defer）：defer 脚本在 DOMContentLoaded 之前执行完毕，
   所以在这里启动一定能拿到 DATA。若文档已解析完（理论上不会，防御），立即启动。 */
function boot() {
  if (window.__mmgtBooted) return;
  window.__mmgtBooted = true;
  loadState();
  bind();
  renderAll();
  applyTheme();
  route();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
/* 版本协商（2026-09-16 P1-10）：SW 对 index.html 用 stale-while-revalidate、对 data.js 用
   network-first，跨版本一拍会拿到「旧壳 + 新数据」→ 结构不兼容即白屏，且会一直持续。
   这里在渲染前先比对：不一致就注销 SW、清空全部缓存，并只强制重载一次（防循环）。 */
(function versionGuard() {
  var shell = window.__MMGT_BUILD__ || 'dev';
  var dataV = (typeof DATA !== 'undefined' && DATA && DATA.v) ? DATA.v : 'dev';
  if (shell === dataV || dataV === 'dev' || shell === 'dev') return;   // 本地 file:// / 开发态不干预
  var KEY = 'mmgt-vguard';
  var last = '';
  try { last = sessionStorage.getItem(KEY) || ''; } catch (e) {}
  if (last === shell + '|' + dataV) return;   // 已经重载过一次仍不一致 → 放弃，避免死循环
  try { sessionStorage.setItem(KEY, shell + '|' + dataV); } catch (e) {}
  console.warn('[mmgt] 壳/数据版本不一致，正在刷新缓存：', shell, 'vs', dataV);
  var done = function () { location.reload(); };
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }).then(function () {
      return (window.caches && caches.keys) ? caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }) : null;
    }).then(done).catch(done);
  } else { done(); }
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {   // SW 安全上下文；LAN IP 明文 http 浏览器不允许，上线 https 后生效
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
